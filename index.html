<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Void Pilot 3D: Rogue Galaxy (10-Min Demo)</title>

  <!-- Monetag Verification -->
  <meta name="monetag" content="82d3390ad1aab921db41509bc54bbbd5">

  <!-- Monetag MultiTag Ad Script -->
  <script src="https://quge5.com/88/tag.min.js" data-zone="283710" async data-cfasync="false"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Share+Tech+Mono&display=swap">

  <style>
    :root {
      --bg: #05070d;
      --card-bg: #0b1120;
      --border: #1e293b;
      --accent: #38bdf8;
      --text: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; -webkit-user-select: none; }
    html, body { width: 100vw; height: 100vh; height: 100dvh; background-color: var(--bg); color: var(--text); overflow: hidden; }

    /* Top Navigation Bar */
    header {
      background: #080d1a;
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 42px;
    }
    .logo { font-size: 1rem; font-weight: 900; color: #fff; letter-spacing: 1.5px; text-decoration: none; }
    .logo span { color: var(--accent); }
    .dev-badge { background: #111e38; border: 1px solid #1e3a8a; color: #facc15; font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; }

    /* Main Theater Wrapper */
    .theater-wrapper {
      position: relative;
      width: 100vw;
      height: calc(100dvh - 42px);
      display: flex;
      flex-direction: column;
      background: #000;
      overflow: hidden;
    }

    .game-theater {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* Embedded Game Frame */
    iframe#game-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Dedicated Fullscreen Button */
    #fs-toggle-btn {
      position: absolute;
      top: 8px;
      right: 12px;
      background: rgba(11, 19, 41, 0.88);
      border: 1.5px solid #38bdf8;
      color: #38bdf8;
      font-size: 9.5px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      z-index: 150;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.35), 2px 2px 0 #000;
    }
    #fs-toggle-btn:active { transform: translate(1px, 1px); background: #0284c7; color: #fff; }

    /* 10-Minute Mission Countdown Clock */
    #demo-timer-badge {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(4, 9, 24, 0.92);
      border: 1px solid #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      padding: 4px 12px;
      font-size: 10.5px;
      font-family: 'Share Tech Mono', monospace;
      font-weight: 900;
      letter-spacing: 1.2px;
      z-index: 100;
      pointer-events: none;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* Demo Expired Modal */
    #demo-expired-modal {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(11, 23, 56, 0.98) 0%, rgba(2, 5, 15, 0.99) 90%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
      text-align: center;
      color: #fff;
    }

    .demo-frame {
      background: #080e1e;
      border: 2px solid #facc15;
      box-shadow: 0 0 30px rgba(250, 204, 21, 0.4);
      padding: 20px;
      max-width: 440px;
      width: 90%;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .btn-action {
      background: #22c55e;
      border: 2px solid #fff;
      color: #000;
      font-weight: 900;
      font-size: 11px;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      transition: 0.2s;
    }
    .btn-action:hover { background: #16a34a; color: #fff; }

    /* Mobile Edge-to-Edge Optimization */
    @media (max-width: 768px), (orientation: landscape) and (max-height: 520px) {
      header { display: none; } /* Hide header on mobile so game gets 100% screen */
      .theater-wrapper { height: 100vh; height: 100dvh; }
    }
  </style>
</head>
<body>

  <!-- Minimal Header (Hidden automatically on phones in landscape) -->
  <header>
    <a href="#" class="logo">⚡ VOID PILOT <span>3D</span></a>
    <div class="dev-badge">DEV: RetrosNotDeadStudio</div>
  </header>

  <div class="theater-wrapper" id="theater-root">
    <div class="game-theater">

      <!-- Fullscreen Button -->
      <button id="fs-toggle-btn">⛶ FULL</button>

      <!-- 10-Minute Mission Clock -->
      <div id="demo-timer-badge">⏱️ DEMO TIME: 10:00</div>

      <!-- Demo Expired Modal -->
      <div id="demo-expired-modal">
        <div class="demo-frame">
          <h2 style="color:#facc15; font-size:16px; letter-spacing:1px;">MISSION EVALUATION COMPLETE</h2>
          <p style="font-size:11px; color:#cbd5e1; line-height:1.4;">
            Your 10-minute trial sortie has concluded. Flight systems have safe-parked.
          </p>
          <p style="font-size:9.5px; color:#94a3b8; line-height:1.4;">
            Launch a brand new 10-minute mission immediately below!
          </p>
          <button id="restart-demo-btn" class="btn-action">
            🚀 LAUNCH NEW 10-MIN MISSION
          </button>
        </div>
      </div>

      <!-- Embedded Game with Full Permission Attributes -->
      <iframe 
        id="game-frame" 
        src="game.html" 
        allow="fullscreen; gamepad; autoplay; screen-wake-lock" 
        allowfullscreen="true" 
        webkitallowfullscreen="true" 
        mozallowfullscreen="true">
      </iframe>
    </div>
  </div>

  <script>
    // ==========================================
    // FULLSCREEN HANDLER (WORKS ON MOBILE)
    // ==========================================
    const fsBtn = document.getElementById("fs-toggle-btn");
    const theaterRoot = document.getElementById("theater-root");

    function toggleFullscreen() {
      const doc = window.document;
      const docEl = theaterRoot;

      const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
      const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

      if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (requestFullScreen) {
          requestFullScreen.call(docEl).catch(() => {});
        }
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
        fsBtn.innerText = "✕ EXIT";
      } else {
        if (cancelFullScreen) {
          cancelFullScreen.call(doc).catch(() => {});
        }
        fsBtn.innerText = "⛶ FULL";
      }
    }

    fsBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleFullscreen();
    });

    // ==========================================
    // 10-MINUTE DEMO CONTROLLER
    // ==========================================
    const DEMO_SECONDS = 600;
    let timeLeft = DEMO_SECONDS;
    let timerActive = false;
    const timerBadge = document.getElementById("demo-timer-badge");
    const expiredModal = document.getElementById("demo-expired-modal");
    const gameFrame = document.getElementById("game-frame");

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    window.addEventListener("blur", () => { timerActive = true; }, { once: true });
    document.addEventListener("pointerdown", () => { timerActive = true; }, { once: true });

    setInterval(() => {
      if (!timerActive || timeLeft <= 0) return;

      timeLeft--;
      timerBadge.innerText = `⏱️ DEMO TIME: ${formatTime(timeLeft)}`;

      if (timeLeft <= 30) {
        timerBadge.style.color = "#ef4444";
        timerBadge.style.borderColor = "#ef4444";
        timerBadge.style.boxShadow = "0 0 14px rgba(239, 68, 68, 0.7)";
      } else if (timeLeft <= 120) {
        timerBadge.style.color = "#facc15";
        timerBadge.style.borderColor = "#facc15";
      }

      if (timeLeft <= 0) {
        expiredModal.style.display = "flex";
        timerBadge.style.display = "none";
      }
    }, 1000);

    document.getElementById("restart-demo-btn").addEventListener("click", () => {
      timeLeft = DEMO_SECONDS;
      expiredModal.style.display = "none";
      timerBadge.style.display = "block";
      timerBadge.style.color = "#38bdf8";
      timerBadge.style.borderColor = "#38bdf8";
      timerBadge.style.boxShadow = "0 0 12px rgba(56, 189, 248, 0.4)";
      gameFrame.src = gameFrame.src;
    });
  </script>
</body>
</html>
