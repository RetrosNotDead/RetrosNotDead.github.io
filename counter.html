<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AussieDreads Gaming - Live Real-Time Sub Counter</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap">

  <style>
    :root {
      --bg: #030712;
      --card-bg: #050d1a;
      --border: #1e3a8a;
      --neon-cyan: #38bdf8;
      --neon-green: #33ff66;
      --neon-amber: #facc15;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Share Tech Mono', monospace; 
      user-select: none; 
      -webkit-user-select: none; 
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
    }

    /* TOP HEADER */
    .top-header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(8, 14, 28, 0.95);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 4px;
      box-shadow: 0 0 14px rgba(2, 132, 199, 0.25);
      flex-shrink: 0;
    }
    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(10px, 2.8vw, 13px);
      color: var(--neon-cyan);
      letter-spacing: 1.5px;
      font-weight: 900;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    }
    .header-btns {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .term-btn {
      background: #111e38;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 900;
      border-radius: 3px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }
    .term-btn:active { background: var(--neon-cyan); color: #000; transform: translate(1px, 1px); }
    .term-btn-gold { border-color: var(--neon-amber); color: var(--neon-amber); }
    .term-btn-gold:active { background: var(--neon-amber); color: #000; }

    /* RETRO ARCADE CABINET VIEWPORT */
    .arcade-wrapper {
      position: relative;
      width: 100%;
      max-width: 900px;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
      border: 3px solid #0284c7;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(2, 132, 199, 0.35), inset 0 0 20px rgba(0, 0, 0, 0.8);
      margin: 8px 0;
      overflow: hidden;
    }

    /* EMBEDDED REAL-TIME ENGINE */
    iframe#live-embed {
      width: 100%;
      height: 100%;
      border: none;
      background: #080d1a;
      display: block;
    }

    /* BOTTOM TELEMETRY DOCK */
    .bottom-dock {
      width: 100%;
      max-width: 900px;
      background: rgba(8, 14, 28, 0.95);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      color: #64748b;
      flex-shrink: 0;
    }
    .live-status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--neon-green);
      font-weight: bold;
    }
    .led-dot {
      width: 6px;
      height: 6px;
      background-color: var(--neon-green);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--neon-green);
      animation: pulseGreen 1.2s infinite alternate ease-in-out;
    }
    @keyframes pulseGreen {
      0% { opacity: 0.4; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header class="top-header">
    <div class="brand-title">⚡ AUSSIEDREADS // LIVE SUB RADAR</div>
    <div class="header-btns">
      <button class="term-btn term-btn-gold" id="fs-btn">⛶ FULL</button>
      <a href="./" class="term-btn">🚀 GAME</a>
    </div>
  </header>

  <!-- RETRO LIVE COUNTER SCREEN -->
  <div class="arcade-wrapper" id="arcade-root">
    <!-- Embedded Live Real-Time YouTube Subscriber Engine -->
    <iframe 
      id="live-embed" 
      src="https://livecounts.io/embed/youtube-live-subscriber-counter/@AussieDreadsGaming"
      allow="fullscreen">
    </iframe>
  </div>

  <!-- BOTTOM STATUS DOCK -->
  <footer class="bottom-dock">
    <div class="live-status">
      <span class="led-dot"></span>
      <span>REAL-TIME STREAM: CONNECTED</span>
    </div>
    <span id="sys-clock">TIME: 00:00:00</span>
  </footer>

  <script>
    // LIVE TICK CLOCK
    function updateClock() {
      const now = new Date();
      document.getElementById("sys-clock").innerText = `TIME: ${now.toLocaleTimeString('en-US')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // FULLSCREEN TOGGLE
    const fsBtn = document.getElementById("fs-btn");
    const arcadeRoot = document.getElementById("arcade-root");

    fsBtn.addEventListener("click", () => {
      const doc = window.document;
      const docEl = arcadeRoot;

      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen;
      const exit = doc.exitFullscreen || doc.webkitExitFullscreen;

      if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {
        if (req) req.call(docEl).catch(() => {});
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
        fsBtn.innerText = "✕ EXIT";
      } else {
        if (exit) exit.call(doc).catch(() => {});
        fsBtn.innerText = "⛶ FULL";
      }
    });
  </script>
</body>
</html>
