<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AussieDreads Gaming - Live Arcade Sub Counter</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Orbitron:wght@700;900&display=swap">

  <style>
    :root {
      --bg: #030712;
      --card-bg: #050d1a;
      --border: #1e3a8a;
      --neon-green: #33ff66;
      --neon-amber: #facc15;
      --neon-cyan: #38bdf8;
      --neon-red: #ef4444;
      --dim-green: #0d381e;
      --dim-amber: #382805;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Share Tech Mono', monospace; 
      user-select: none; 
      -webkit-user-select: none; 
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
    }

    /* TOP TERMINAL BAR */
    .top-header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(8, 14, 28, 0.95);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 4px;
      box-shadow: 0 0 14px rgba(2, 132, 199, 0.25);
    }
    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(10px, 2.8vw, 13px);
      color: var(--neon-cyan);
      letter-spacing: 1.5px;
      font-weight: 900;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    }
    .header-btns {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .term-btn {
      background: #111e38;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 900;
      border-radius: 3px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }
    .term-btn:active { background: var(--neon-cyan); color: #000; transform: translate(1px, 1px); }
    .term-btn-gold { border-color: var(--neon-amber); color: var(--neon-amber); }
    .term-btn-gold:active { background: var(--neon-amber); color: #000; }

    /* MAIN COUNTER STAGE */
    .counter-stage {
      width: 100%;
      max-width: 900px;
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 8px 0;
      align-items: center;
    }
    @media (max-width: 600px) and (orientation: portrait) {
      .counter-stage { grid-template-columns: 1fr; }
    }

    .counter-bay {
      background: var(--card-bg);
      border: 3px solid #0f2744;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.9);
      border-radius: 6px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      max-height: 280px;
      position: relative;
    }

    .bay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e3a8a;
      padding-bottom: 4px;
    }
    .bay-label {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(9px, 2.2vw, 11px);
      letter-spacing: 1.5px;
      font-weight: 900;
    }
    .live-pulse {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 8.5px;
      color: #94a3b8;
    }
    .led-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      animation: ledBlink 1.2s infinite alternate ease-in-out;
    }
    @keyframes ledBlink {
      0% { opacity: 0.3; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.15); }
    }

    /* DIGITAL MARQUEE READOUT */
    .digital-display {
      background: #00040a;
      border: 2px solid #112233;
      border-radius: 4px;
      padding: 10px 8px;
      margin: 8px 0;
      text-align: center;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .digital-digits {
      font-family: 'VT323', monospace;
      font-size: clamp(48px, 12vw, 76px);
      line-height: 1;
      letter-spacing: 4px;
      font-weight: 900;
    }

    /* PROGRESS BAR TOWARD MILESTONE */
    .milestone-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 8.5px;
      color: #94a3b8;
    }
    .progress-track {
      width: 100%;
      height: 7px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      transition: width 0.6s ease;
    }

    /* BOTTOM TELEMETRY DOCK */
    .bottom-dock {
      width: 100%;
      max-width: 900px;
      background: rgba(8, 14, 28, 0.95);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      color: #64748b;
    }

    /* POPUP CALIBRATION MODAL */
    #edit-modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 15px;
    }
    .modal-frame {
      background: #080e1e;
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
      padding: 16px;
      max-width: 380px;
      width: 100%;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-frame h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      color: var(--neon-cyan);
      letter-spacing: 1px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      text-align: left;
    }
    .input-group label {
      font-size: 9px;
      color: #94a3b8;
    }
    .input-group input {
      background: #020617;
      border: 1px solid #1e3a8a;
      color: #fff;
      padding: 8px 10px;
      font-size: 14px;
      border-radius: 3px;
      outline: none;
    }
    .input-group input:focus { border-color: var(--neon-cyan); }
    .modal-btns {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    /* CRT SCANLINE OVERLAY */
    .crt-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 1.5px, rgba(0,0,0,0.3) 1.5px, rgba(0,0,0,0.3) 3px);
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="crt-lines"></div>

  <!-- TOP HEADER -->
  <header class="top-header">
    <div class="brand-title">⚡ AUSSIEDREADS // FLIGHT TELEMETRY</div>
    <div class="header-btns">
      <button class="term-btn" id="edit-btn">⚙️ CALIBRATE</button>
      <button class="term-btn term-btn-gold" id="fs-btn">⛶ FULL</button>
      <a href="./" class="term-btn">🚀 GAME</a>
    </div>
  </header>

  <!-- MAIN DUAL MARQUEE -->
  <main class="counter-stage">

    <!-- SUBSCRIBERS BAY -->
    <div class="counter-bay" style="border-color: #064e3b;">
      <div class="bay-header">
        <span class="bay-label" style="color: var(--neon-green);">SUBSCRIBERS</span>
        <div class="live-pulse">
          <div class="led-dot" style="background: var(--neon-green); box-shadow: 0 0 6px var(--neon-green);"></div>
          <span>PILOTS ENLISTED</span>
        </div>
      </div>

      <div class="digital-display" style="border-color: #064e3b;">
        <span class="digital-digits" id="sub-display" style="color: var(--neon-green); text-shadow: 0 0 16px rgba(51, 255, 102, 0.7);">001,272</span>
      </div>

      <div class="milestone-box">
        <div style="display: flex; justify-content: space-between;">
          <span>GOAL: 2,000 SUBS</span>
          <span id="sub-pct-txt" style="color: var(--neon-green);">63.6%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="sub-progress-bar" style="background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green);"></div>
        </div>
      </div>
    </div>

    <!-- TOTAL VIEWS BAY -->
    <div class="counter-bay" style="border-color: #78350f;">
      <div class="bay-header">
        <span class="bay-label" style="color: var(--neon-amber);">TOTAL VIEWS</span>
        <div class="live-pulse">
          <div class="led-dot" style="background: var(--neon-amber); box-shadow: 0 0 6px var(--neon-amber);"></div>
          <span>SORTIES WATCHED</span>
        </div>
      </div>

      <div class="digital-display" style="border-color: #78350f;">
        <span class="digital-digits" id="views-display" style="color: var(--neon-amber); text-shadow: 0 0 16px rgba(250, 204, 21, 0.7);">013,338</span>
      </div>

      <div class="milestone-box">
        <div style="display: flex; justify-content: space-between;">
          <span>GOAL: 50,000 VIEWS</span>
          <span id="views-pct-txt" style="color: var(--neon-amber);">26.7%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="views-progress-bar" style="background: var(--neon-amber); box-shadow: 0 0 8px var(--neon-amber);"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- BOTTOM STATUS DOCK -->
  <footer class="bottom-dock">
    <span>SYSTEM: ONLINE &bull; 60FPS CRT RASTERIZER</span>
    <span id="sys-clock">TIME: 00:00:00</span>
  </footer>

  <!-- QUICK CALIBRATION MODAL -->
  <div id="edit-modal">
    <div class="modal-frame">
      <h2>⚙️ CALIBRATE COUNTERS</h2>
      <div class="input-group">
        <label>TOTAL SUBSCRIBERS (YOUTUBE):</label>
        <input type="number" id="input-subs" value="1272" />
      </div>
      <div class="input-group">
        <label>TOTAL CHANNEL / REEL VIEWS:</label>
        <input type="number" id="input-views" value="13338" />
      </div>
      <div class="modal-btns">
        <button class="term-btn" style="flex:1; padding:8px;" id="save-modal-btn">SAVE COUNTS</button>
        <button class="term-btn" style="flex:1; padding:8px; border-color:#ef4444; color:#ef4444;" id="close-modal-btn">CANCEL</button>
      </div>
    </div>
  </div>

  <script>
    // LOAD SAVED DATA (OR DEFAULTS)
    let subs = parseInt(localStorage.getItem("ad_sub_count") || "1272", 10);
    let views = parseInt(localStorage.getItem("ad_view_count") || "13338", 10);

    const subDisplay = document.getElementById("sub-display");
    const viewsDisplay = document.getElementById("views-display");
    const subProgressBar = document.getElementById("sub-progress-bar");
    const viewsProgressBar = document.getElementById("views-progress-bar");
    const subPctTxt = document.getElementById("sub-pct-txt");
    const viewsPctTxt = document.getElementById("views-pct-txt");

    function renderCounters() {
      // 6-digit zero padded format (e.g. 001,272)
      subDisplay.innerText = subs.toLocaleString('en-US').padStart(7, '0');
      viewsDisplay.innerText = views.toLocaleString('en-US').padStart(7, '0');

      // Milestone 1: 2,000 Subs
      const subPct = Math.min(100, Math.max(0, (subs / 2000) * 100));
      subProgressBar.style.width = `${subPct}%`;
      subPctTxt.innerText = `${subPct.toFixed(1)}%`;

      // Milestone 2: 50,000 Views
      const viewPct = Math.min(100, Math.max(0, (views / 50000) * 100));
      viewsProgressBar.style.width = `${viewPct}%`;
      viewsPctTxt.innerText = `${viewPct.toFixed(1)}%`;
    }

    renderCounters();

    // LIVE TICK CLOCK
    function updateClock() {
      const now = new Date();
      document.getElementById("sys-clock").innerText = `TIME: ${now.toLocaleTimeString('en-US')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // FULLSCREEN TOGGLE
    const fsBtn = document.getElementById("fs-btn");
    fsBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
        fsBtn.innerText = "✕ EXIT";
      } else {
        document.exitFullscreen().catch(() => {});
        fsBtn.innerText = "⛶ FULL";
      }
    });

    // CALIBRATION MODAL
    const editModal = document.getElementById("edit-modal");
    const editBtn = document.getElementById("edit-btn");
    const closeModalBtn = document.getElementById("close-modal-btn");
    const saveModalBtn = document.getElementById("save-modal-btn");
    const inputSubs = document.getElementById("input-subs");
    const inputViews = document.getElementById("input-views");

    editBtn.addEventListener("click", () => {
      inputSubs.value = subs;
      inputViews.value = views;
      editModal.style.display = "flex";
    });

    closeModalBtn.addEventListener("click", () => {
      editModal.style.display = "none";
    });

    saveModalBtn.addEventListener("click", () => {
      subs = parseInt(inputSubs.value, 10) || 0;
      views = parseInt(inputViews.value, 10) || 0;
      localStorage.setItem("ad_sub_count", subs.toString());
      localStorage.setItem("ad_view_count", views.toString());
      renderCounters();
      editModal.style.display = "none";
    });
  </script>
</body>
</html>
