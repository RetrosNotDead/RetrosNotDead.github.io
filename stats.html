<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Void Pilot 3D - Mission Control (Read-Only)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; }
    body {
      background: #030712;
      color: #94a3b8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      text-align: center;
    }

    .dashboard-card {
      background: #080e1e;
      border: 2px solid #0284c7;
      box-shadow: 0 0 25px rgba(2, 132, 199, 0.35);
      border-radius: 8px;
      padding: 16px;
      max-width: 500px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    h1 {
      font-size: 1.15rem;
      color: #38bdf8;
      letter-spacing: 2px;
    }

    .read-only-badge {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid #166534;
      color: #4ade80;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .frame-container {
      width: 100%;
      height: 380px;
      border: 1px solid #1e3a8a;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn {
      flex: 1;
      background: #111e38;
      border: 1px solid #38bdf8;
      color: #fff;
      padding: 10px;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
      display: inline-block;
      transition: 0.2s;
    }
    .btn:active { background: #0284c7; }
    .btn-green { border-color: #22c55e; color: #4ade80; }
  </style>
</head>
<body>

  <div class="dashboard-card">
    <h1>🛰️ MISSION CONTROL</h1>
    <div class="read-only-badge">🔒 100% READ-ONLY (DOES NOT COUNT YOUR REFRESHES)</div>

    <!-- Live Read-Only Status Frame -->
    <div class="frame-container">
      <iframe id="status-frame" src="https://visitorbadge.io/status?path=retrosnotdead.github.io"></iframe>
    </div>

    <div class="btn-row">
      <button class="btn" id="refresh-btn">🔄 REFRESH VIEW</button>
      <a class="btn btn-green" href="https://publishers.monetag.com/statistics" target="_blank">💰 MONETAG $$</a>
    </div>

    <a href="https://retrosnotdead.github.io/" target="_blank" style="color:#38bdf8; font-size:0.75rem; text-decoration:none;">
      Launch Game Tab ↗
    </a>
  </div>

  <script>
    const frame = document.getElementById("status-frame");
    const refreshBtn = document.getElementById("refresh-btn");

    refreshBtn.addEventListener("click", () => {
      frame.src = frame.src;
      refreshBtn.innerText = "UPDATED!";
      setTimeout(() => { refreshBtn.innerText = "🔄 REFRESH VIEW"; }, 1000);
    });
  </script>
</body>
</html>
