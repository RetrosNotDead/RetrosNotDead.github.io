<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Void Pilot 3D - Mission Control Stats</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;700;900&display=swap">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; }
    body {
      background: #030712;
      color: #94a3b8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .dashboard-card {
      background: #080e1e;
      border: 2px solid #0284c7;
      box-shadow: 0 0 25px rgba(2, 132, 199, 0.35);
      border-radius: 8px;
      padding: 25px;
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    h1 {
      font-size: 1.2rem;
      color: #38bdf8;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }

    .badge-display {
      background: #030712;
      border: 1px solid #1e3a8a;
      padding: 15px;
      border-radius: 6px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .badge-display img {
      height: 32px;
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .status-text {
      font-size: 0.8rem;
      color: #4ade80;
    }

    .refresh-bar {
      font-size: 0.75rem;
      color: #facc15;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn {
      flex: 1;
      background: #111e38;
      border: 1px solid #38bdf8;
      color: #fff;
      padding: 10px;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
      display: inline-block;
      transition: 0.2s;
    }
    .btn:active { background: #0284c7; }
    .btn-green { border-color: #22c55e; color: #4ade80; }
  </style>
</head>
<body>

  <div class="dashboard-card">
    <h1>🛰️ MISSION CONTROL</h1>
    <div style="font-size:0.75rem; color:#64748b;">VOID PILOT 3D LIVE TRAFFIC MONITOR</div>

    <!-- Live Badge Container -->
    <div class="badge-display">
      <span style="font-size:0.75rem; color:#94a3b8;">TOTAL SORTIES LOGGED:</span>
      <img id="counter-img" src="" alt="Live Visitors Count" />
      <div class="status-text">● RADAR LINK ACTIVE</div>
    </div>

    <div class="refresh-bar" id="refresh-timer">AUTO-REFRESH IN: 20s</div>

    <div class="btn-row">
      <button class="btn" id="manual-refresh-btn">🔄 REFRESH NOW</button>
      <a class="btn btn-green" href="https://publishers.monetag.com/statistics" target="_blank">💰 MONETAG $$</a>
    </div>

    <a href="https://retrosnotdead.github.io/" target="_blank" style="color:#38bdf8; font-size:0.75rem; text-decoration:none;">
      Launch Game Tab ↗
    </a>
  </div>

  <script>
    const img = document.getElementById("counter-img");
    const timerText = document.getElementById("refresh-timer");
    const manualBtn = document.getElementById("manual-refresh-btn");

    let countdown = 20;

    function reloadBadge() {
      // Appends random timestamp so browser never caches the old image
      const timestamp = new Date().getTime();
      img.src = `https://api.visitorbadge.io/api/visitors?path=retrosnotdead.github.io&label=TOTAL%20VISITS&countColor=%2338bdf8&labelColor=%23080d1a&style=for-the-badge&_t=${timestamp}`;
      countdown = 20;
    }

    // Initial load
    reloadBadge();

    // Auto-refresh countdown every second
    setInterval(() => {
      countdown--;
      timerText.innerText = `AUTO-REFRESH IN: ${countdown}s`;
      if (countdown <= 0) {
        reloadBadge();
      }
    }, 1000);

    manualBtn.addEventListener("click", () => {
      reloadBadge();
      manualBtn.innerText = "UPDATED!";
      setTimeout(() => { manualBtn.innerText = "🔄 REFRESH NOW"; }, 1000);
    });
  </script>
</body>
</html>
